<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week Project — Settimana III</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="icon" type="img.png" href="assets/img/game.png" />
  </head>

  <body>
    <header class="header-principale">
      <h1>
        <img src="assets/img/game.png" alt="imaggine tracker inventory" />
        Tracker Inventario
        <p>Aggiungi e crafta i tuoi item</p>
      </h1>
      <div class="tema-scuro-chiaro">
        <button id="btn-tema">🌗</button>
      </div>
    </header>

    <main>
      <div class="box-affiancato">
        <h2>Raccogli Oggetto</h2>
        <form id="form-raccolta">
          <div>
            <label for="input-nome">Nome Oggetto *</label>
            <input
              type="text"
              id="input-nome"
              placeholder="Es. Gomitolo di Lana"
              required
            />
          </div>

          <div>
            <label for="input-quantita">Quantità *</label>
            <input
              type="number"
              id="input-quantita"
              min="1"
              value="1"
              required
            />
          </div>

          <div>
            <label for="select-rerita">Rarità *</label>
            <select id="select-rarita" required>
              <option value="">Scegli rarità...</option>
              <option value="comune">Comune</option>
              <option value="epico">Epico</option>
              <option value="leggendario">Leggendario</option>
            </select>
          </div>
          <div>
            <button type="submit" class="btn-invia">Metti nello Zaino</button>
          </div>
        </form>
      </div>

      <!--PARTE DEI FILTRI DELLO ZAINO-->

      <div class="box-affiancato">
        <h2>Filtra lo zaino</h2>
        <form>
          <div class="filtro-box">
            <label for="filtro-cerca">Cerca per nome:</label>
            <input
              type="search"
              id="filtro-cerca"
              placeholder="Scrivi per cercare..."
            />
          </div>

          <div class="filtro-box">
            <label for="filtro-rarita">Rarità:</label>
            <select id="filtro-rarita">
              <option value="tutti">Tutte le rarità</option>
              <option value="comune">Comune 🟢</option>
              <option value="epico">Epico 🟣</option>
              <option value="leggendario">Leggendario 🟡</option>
            </select>
          </div>

          <div class="filtro-box">
            <label for="filtro-ordine">Ordina per:</label>
            <select id="filtro-ordine">
              <option value="nome-asc">Nome (A-Z)</option>
              <option value="nome-desc">Nome (Z-A)</option>
              <option value="quantita-desc">Quantità (Maggiore)</option>
              <option value="quantita-asc">Quantità (Minore)</option>
            </select>
          </div>
        </form>
      </div>

      <!--questa invece e la parte di arrivo del form-->

      <div class="stato-zaino-stretto">
        <h3>Stato dello Zaino</h3>
        <div class="stato-container-stretto">
          <div class="stato-info-sinistra">
            <p>Legenda</p>
            <ul class="legenda-voce">
              <li>Comune🟢</li>
              <li>Epico🟣</li>
              <li>Legg.🟡</li>
            </ul>
          </div>

          <div class="stato-barra-destra">
            <label>Ripartizione e Capacità dello Zaino:</label>
            <div class="sfondo-barra-unica">
              <div
                id="barra-comune"
                class="barra rarita-comune"
                style="width: 0%"
              ></div>
              <div
                id="barra-epico"
                class="barra rarita-epico"
                style="width: 0%"
              ></div>
              <div
                id="barra-leggendario"
                class="barra rarita-leggendario"
                style="width: 0"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <div class="tabellone-inventario">
        <h2>Oggetti Conservati (<span id="totale-oggetti">0</span>)</h2>
        <div id="lista-inventario"></div>
      </div>
      <div style="text-align: center; margin: 20px 0">
        <button id="btn-reset-zaino" class="btn-azione">
          Reset local storage e oggetti predefiniti
        </button>
      </div>
    </main>

    <footer>
      <h2>© 2026 — Sviluppato da Cristian</h2>
    </footer>

    <script src="assets/js/script.js"></script>
  </body>
</html>

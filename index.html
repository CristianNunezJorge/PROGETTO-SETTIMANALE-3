<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week Project — Settimana III</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="icon" type="img.png" href="assets/img/game.png" />
  </head>

  <body>
    <!--HEADER PROVATO RESPONSIVE-->
    <header class="header-principale">
      <!-- Titolo dell'app + sottotitolo + button tema chiaro/scuro -->

      <h1>
        Tracker Inventario<!--NON SI FA MA LO HO AGGIUNTO ALL'ULTIMO-->
        <p>Aggiungi e crafta i tuoi item</p>
      </h1>
      <div class="tema-scuro-chiaro">
        <button>🌗</button>
      </div>
    </header>

    <main>
      <!--QUESTA E LA PARTE DEL FORM PER RACCOGLIERE-->

      <div>
        <h2>Raccogli Oggetto</h2>
        <form>
          <div>
            <label>Nome Oggetto *</label>
            <input type="text" placeholder="Es. Gomitolo di Lana" />
          </div>

          <div>
            <label>Quantità *</label>
            <input type="number" />
          </div>

          <div class="form-group">
            <label for="select-categoria">Rarità *</label>
            <select>
              <option value="">Scegli rarità...</option>
              <option value="comune">Comune</option>
              <option value="epico">Epico</option>
              <option value="leggendario">Leggendario</option>
            </select>
          </div>

          <button type="submit">Metti nello Zaino</button>
        </form>
      </div>

      <!--PARTE DEI FILTRI DELLO ZAINO-->

      <div>
        <h2>Filtra lo zaino</h2>
        <div>
          <label>Cerca per nome:</label>
          <input type="search" placeholder="Scrivi per cercare..." />
        </div>

        <div>
          <label>Rarità:</label>
          <select>
            <option value="tutti">Tutte le rarità</option>
            <option value="comune">Comune ⚪</option>
            <option value="epico">Epico 🟣</option>
            <option value="leggendario">Leggendario 🟡</option>
          </select>
        </div>

        <div>
          <label>Ordina per:</label>
          <select>
            <option value="nome-asc">Nome (A-Z)</option>
            <option value="nome-desc">Nome (Z-A)</option>
          </select>
        </div>

        <div>
          <span>Visualizzazione:</span>
          <button>Lista</button>
          <button>Griglia</button>
          <button>Dettagli</button>
        </div>
      </div>

      <!--questa invece e la parte di arrivo del form-->
      <div>
        <h3>Stato dello Zaino</h3>
        <div>
          <p>Slot occupati:0</p>

          <p>Capacità totale dello zaino:</p>
          <div>
            <div></div>
          </div>
        </div>
        <div>
          <h2>Oggetti nello Zaino</h2>
          <div></div>
        </div>
        <div>Oggetto aggiunto con successo!</div>
      </div>
    </main>

    <footer>
      <!-- Autore, anno -->
    </footer>

    <script src="assets/js/script.js"></script>
  </body>
</html>
